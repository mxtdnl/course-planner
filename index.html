<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Build Tracker</title>
<style>
/* ============================================================
   Course Build Tracker — single file, offline, vanilla JS
   Visual direction (spec §6): dense, quiet, neutral. The status
   ramp is the only strong colour: a single green hue rising in
   saturation across todo→tested so progress reads left-to-right.
   blocked breaks the ramp as amber; not-needed recedes to grey.
   ============================================================ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --fs-xs: 11px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 19px;
  --w-reg: 400; --w-semi: 600;
  --sp: 8px;
  --radius: 6px;

  --bg:#f5f6f8; --surface:#ffffff; --panel:#fbfcfd; --raised:#ffffff;
  --border:#e0e3e8; --border-strong:#c9ced6;
  --text:#1b2026; --muted:#6a727e; --faint:#9aa2ad;
  --accent:#1f7a5a; --accent-fg:#ffffff;
  --shadow: 0 1px 2px rgba(20,25,30,.06), 0 6px 20px rgba(20,25,30,.07);
  --warn:#b25a12;

  /* status ramp — light */
  --st-not-needed-bg:#eceef1; --st-not-needed-fg:#8b929c; --st-not-needed-br:#dfe2e7;
  --st-blocked-bg:#fbe6cf; --st-blocked-fg:#9a5410; --st-blocked-br:#eabf8f;
  --st-todo-bg:#e7ebf0; --st-todo-fg:#495260; --st-todo-br:#d4dae2;
  --st-specced-bg:#d5ece0; --st-specced-fg:#276b4d; --st-specced-br:#b6dcc9;
  --st-in-progress-bg:#b3e0c9; --st-in-progress-fg:#1c6446; --st-in-progress-br:#8fd0af;
  --st-built-bg:#79c9a1; --st-built-fg:#0f4d33; --st-built-br:#5bbb8b;
  --st-tested-bg:#1f9e6b; --st-tested-fg:#ffffff; --st-tested-br:#178b5d;
}
:root[data-theme="dark"]{
  --bg:#131619; --surface:#1b1f24; --panel:#171b1f; --raised:#20252b;
  --border:#2a3037; --border-strong:#3a424b;
  --text:#e6e9ec; --muted:#98a0aa; --faint:#69717b;
  --accent:#3bbd8a; --accent-fg:#0c1512;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --warn:#e0a25f;

  --st-not-needed-bg:#23282e; --st-not-needed-fg:#7b838d; --st-not-needed-br:#2d333a;
  --st-blocked-bg:#4a3316; --st-blocked-fg:#e7b073; --st-blocked-br:#5e441f;
  --st-todo-bg:#262c33; --st-todo-fg:#aab3bd; --st-todo-br:#333a42;
  --st-specced-bg:#1e3a2d; --st-specced-fg:#7fcea6; --st-specced-br:#2a4c3b;
  --st-in-progress-bg:#22503a; --st-in-progress-fg:#96dcb6; --st-in-progress-br:#2f6349;
  --st-built-bg:#2c6b4c; --st-built-fg:#c3edd5; --st-built-br:#38805c;
  --st-tested-bg:#33b481; --st-tested-fg:#08130d; --st-tested-br:#2aa273;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131619; --surface:#1b1f24; --panel:#171b1f; --raised:#20252b;
    --border:#2a3037; --border-strong:#3a424b;
    --text:#e6e9ec; --muted:#98a0aa; --faint:#69717b;
    --accent:#3bbd8a; --accent-fg:#0c1512;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --warn:#e0a25f;
    --st-not-needed-bg:#23282e; --st-not-needed-fg:#7b838d; --st-not-needed-br:#2d333a;
    --st-blocked-bg:#4a3316; --st-blocked-fg:#e7b073; --st-blocked-br:#5e441f;
    --st-todo-bg:#262c33; --st-todo-fg:#aab3bd; --st-todo-br:#333a42;
    --st-specced-bg:#1e3a2d; --st-specced-fg:#7fcea6; --st-specced-br:#2a4c3b;
    --st-in-progress-bg:#22503a; --st-in-progress-fg:#96dcb6; --st-in-progress-br:#2f6349;
    --st-built-bg:#2c6b4c; --st-built-fg:#c3edd5; --st-built-br:#38805c;
    --st-tested-bg:#33b481; --st-tested-fg:#08130d; --st-tested-br:#2aa273;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); font-size:var(--fs-md); line-height:1.5;
  color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--st-in-progress-bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}

.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:14px;
  padding:9px 16px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:4px}
.brand b{font-weight:var(--w-semi);font-size:var(--fs-md);letter-spacing:-.01em}
.brand span{font-size:var(--fs-xs);color:var(--muted)}
.nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px}
.nav button{
  border:0;background:transparent;padding:5px 12px;border-radius:6px;
  font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:7px;
}
.nav button .k{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:3px;padding:0 3px}
.nav button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:var(--w-semi)}
.nav button.active .k{color:var(--muted)}
.spacer{flex:1}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox input{
  width:210px;padding:6px 10px 6px 28px;border:1px solid var(--border);border-radius:7px;
  background:var(--panel);font-size:var(--fs-sm);
}
.searchbox .mag{position:absolute;left:9px;color:var(--faint);font-size:13px;pointer-events:none}
.iconbtn{
  border:1px solid var(--border);background:var(--panel);border-radius:7px;
  padding:6px 10px;font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:6px;
}
.iconbtn:hover{color:var(--text);border-color:var(--border-strong)}
.menu-wrap{position:relative}
.menu{
  position:absolute;right:0;top:calc(100% + 6px);z-index:50;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);
  min-width:230px;padding:6px;
}
.menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:var(--fs-sm);gap:8px;align-items:center;justify-content:space-between}
.menu button:hover{background:var(--panel)}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}
.menu .lbl{font-size:var(--fs-xs);color:var(--faint);padding:6px 10px 3px;text-transform:uppercase;letter-spacing:.05em}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:2px;margin:2px 6px}
.seg button{flex:1;justify-content:center;padding:5px;border-radius:4px;font-size:var(--fs-xs)}
.seg button.on{background:var(--surface);box-shadow:var(--shadow);color:var(--text);font-weight:var(--w-semi)}

/* ---------- layout ---------- */
.view{padding:14px 16px 60px}
.hidden{display:none !important}

/* ---------- status chip ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:20px;font-size:var(--fs-xs);font-weight:var(--w-semi);
  border:1px solid transparent;white-space:nowrap;line-height:1.7;
}
.chip[data-st="not-needed"]{background:var(--st-not-needed-bg);color:var(--st-not-needed-fg);border-color:var(--st-not-needed-br);font-weight:var(--w-reg);font-style:italic}
.chip[data-st="blocked"]{background:var(--st-blocked-bg);color:var(--st-blocked-fg);border-color:var(--st-blocked-br)}
.chip[data-st="todo"]{background:var(--st-todo-bg);color:var(--st-todo-fg);border-color:var(--st-todo-br)}
.chip[data-st="specced"]{background:var(--st-specced-bg);color:var(--st-specced-fg);border-color:var(--st-specced-br)}
.chip[data-st="in-progress"]{background:var(--st-in-progress-bg);color:var(--st-in-progress-fg);border-color:var(--st-in-progress-br)}
.chip[data-st="built"]{background:var(--st-built-bg);color:var(--st-built-fg);border-color:var(--st-built-br)}
.chip[data-st="tested"]{background:var(--st-tested-bg);color:var(--st-tested-fg);border-color:var(--st-tested-br)}

.ttag{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--panel)}
.badge{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);color:var(--muted);background:var(--panel)}
.badge.tier1{border-color:var(--st-built-br);color:var(--st-built-fg);background:var(--st-specced-bg)}
.badge.tier2{border-color:var(--border-strong)}
.badge.tier3{opacity:.6}
.badge.over{color:#b23b3b;border-color:#e2a5a5;background:#fbe7e7}
:root[data-theme="dark"] .badge.over{color:#f0a3a3;border-color:#7a3b3b;background:#3a2020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.over{color:#f0a3a3;border-color:#7a3b3b;background:#3a2020}}

/* ---------- board ---------- */
.filters{
  display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:12px;
}
.fgroup{display:flex;align-items:center;gap:4px}
.fgroup > .fglabel{font-size:var(--fs-xs);color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.pill{
  border:1px solid var(--border);background:var(--panel);border-radius:20px;padding:3px 9px;font-size:var(--fs-xs);color:var(--muted);
}
.pill:hover{border-color:var(--border-strong)}
.pill.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fdiv{width:1px;height:20px;background:var(--border)}
.clearf{margin-left:auto;font-size:var(--fs-xs);color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:2px}

.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:1 0 190px;min-width:190px;background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
.col.dragover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.col.collapsed{flex:0 0 46px;min-width:46px}
.colhead{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.colhead .dot{width:8px;height:8px;border-radius:50%;flex:none}
.colhead .name{font-size:var(--fs-sm);font-weight:var(--w-semi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .cnt{margin-left:auto;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted)}
.col.collapsed .colhead{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-start;height:100%;padding:10px 8px}
.col.collapsed .cnt{margin-left:0;margin-top:6px}
.collist{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.col.collapsed .collist{display:none}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 10px;
  box-shadow:0 1px 1px rgba(20,25,30,.04);cursor:grab;
}
.card:hover{border-color:var(--border-strong)}
.card.dragging{opacity:.45}
.card .r1{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.card .title{font-size:var(--fs-sm);font-weight:var(--w-semi);line-height:1.35;margin:2px 0 6px;letter-spacing:-.005em}
.card .r2{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.card .init{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.card .blk{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.blkchip{font-family:var(--mono);font-size:10px;color:var(--st-blocked-fg);background:var(--st-blocked-bg);border:1px solid var(--st-blocked-br);border-radius:4px;padding:1px 5px}
.prog{font-family:var(--mono);font-size:10px;color:var(--muted)}
.card .snum{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--panel)}
.card .snum.course{color:var(--faint)}

/* ---------- matrix ---------- */
.matwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table.matrix{border-collapse:collapse;width:100%;min-width:1000px}
table.matrix th,table.matrix td{border:1px solid var(--border);padding:0;vertical-align:top}
table.matrix thead th{
  position:sticky;top:0;z-index:2;background:var(--panel);
  font-size:var(--fs-xs);font-weight:var(--w-semi);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
  padding:7px 6px;text-align:center;white-space:nowrap;
}
table.matrix thead th.seshead{text-align:left;min-width:240px;position:sticky;left:0;z-index:3}
th.seshead,td.sescell{position:sticky;left:0;background:var(--surface);z-index:1}
td.sescell{padding:7px 9px;min-width:240px;border-left:0}
.sescell .snhead{display:flex;align-items:baseline;gap:7px;cursor:pointer}
.sescell .snhead .n{font-family:var(--mono);font-size:var(--fs-sm);color:var(--muted)}
.sescell .snhead .t{font-size:var(--fs-sm);font-weight:var(--w-semi);line-height:1.25}
.sescell:hover .snhead .t{text-decoration:underline;text-underline-offset:2px}
.sescell .meta{display:flex;gap:6px;align-items:center;margin-top:3px}
.blocktag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-family:var(--mono)}
.mwarn{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 4px}
.matcell{padding:5px;text-align:center;min-width:92px;height:44px}
.matcell .cellchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.emptycell{display:block;width:100%;height:100%;min-height:30px;border:1px dashed var(--border-strong);border-radius:5px;background:transparent;color:var(--faint);opacity:.5}
.emptycell:hover{opacity:1;border-color:var(--accent);color:var(--accent)}
.matcell.done{text-align:center;font-family:var(--mono);font-size:var(--fs-xs)}
td.donecell{text-align:center;font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);min-width:70px;background:var(--panel)}
tfoot td{background:var(--panel);font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);text-align:center;padding:6px}
tfoot td.sescell{font-family:var(--font);font-weight:var(--w-semi);color:var(--text);text-align:left}
.minichip{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid transparent}
.printbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

/* ---------- sessions view ---------- */
.sesslayout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.railwrap{position:sticky;top:64px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;max-height:calc(100vh - 90px);overflow:auto}
.railgroup{margin-bottom:8px}
.railgroup > .gh{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:6px 8px 4px}
.railitem{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;font-size:var(--fs-sm)}
.railitem:hover{background:var(--panel)}
.railitem.active{background:var(--panel);font-weight:var(--w-semi);box-shadow:inset 2px 0 0 var(--accent)}
.railitem .rn{font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);flex:none;width:18px}
.railitem .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.spanel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;max-width:920px}
.spanel h1{font-size:var(--fs-lg);margin:0 0 3px;letter-spacing:-.01em}
.spanel .sub{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--muted);font-size:var(--fs-sm);margin-bottom:14px}
.spanel .sub .mono{font-size:var(--fs-xs)}
.strip{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--panel)}
.strip .sh{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:8px}
.assetchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.assetchip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;padding:3px 4px 3px 8px;background:var(--surface)}
.assetchip .an{font-size:var(--fs-sm);cursor:pointer}
.assetchip select{border:1px solid var(--border);border-radius:5px;padding:2px 4px;font-size:var(--fs-xs);background:var(--panel)}
.decref{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:var(--fs-sm)}
.decref .did{font-family:var(--mono);font-size:var(--fs-xs);color:var(--muted);flex:none}

.field{margin-bottom:14px}
.field > .flabel{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:5px}
.field .mins{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted);text-transform:none;letter-spacing:0}
.field .mins input{width:42px;text-align:right;border:1px solid var(--border);border-radius:5px;padding:2px 5px;font-family:var(--mono);font-size:var(--fs-xs);background:var(--panel)}
.editable{border:1px solid transparent;border-radius:7px;padding:8px 10px;cursor:text;background:var(--panel);min-height:20px}
.editable:hover{border-color:var(--border)}
.editable.empty{color:var(--faint);font-style:italic}
.editable p{margin:0 0 8px}.editable p:last-child{margin-bottom:0}
.editable ul{margin:6px 0;padding-left:20px}.editable li{margin:2px 0}
.editable blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--border-strong);color:var(--muted)}
.editable strong{font-weight:var(--w-semi)}
textarea.edit{width:100%;border:1px solid var(--accent);border-radius:7px;padding:8px 10px;background:var(--surface);resize:none;overflow:hidden;line-height:1.55;font-size:var(--fs-md)}
input.titleedit{width:100%;font-size:var(--fs-lg);font-weight:var(--w-semi);border:1px solid transparent;border-radius:6px;padding:2px 4px;background:transparent;letter-spacing:-.01em}
input.titleedit:hover{border-color:var(--border)}
input.titleedit:focus{border-color:var(--accent);background:var(--surface);outline:none}
.metaedit{border:1px solid transparent;background:transparent;border-radius:5px;padding:2px 6px}
.metaedit:hover{border-color:var(--border)}
.metaedit:focus{border-color:var(--accent);background:var(--surface);outline:none}

.readings{list-style:none;margin:0;padding:0}
.reading{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border)}
.reading:last-child{border-bottom:0}
.reading .cite{flex:1;font-size:var(--fs-sm)}
.reading .cite input{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 5px}
.reading .cite input:hover{border-color:var(--border)}
.reading .cite input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.reading select{border:1px solid var(--border);border-radius:5px;padding:2px 4px;font-size:var(--fs-xs);background:var(--panel)}
.unverified{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 5px;white-space:nowrap}
.minibtn{border:1px solid var(--border);background:var(--panel);border-radius:5px;width:22px;height:22px;padding:0;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.minibtn:hover{color:var(--text);border-color:var(--border-strong)}
.minibtn:disabled{opacity:.3;cursor:default}
.addrow{margin-top:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-size:var(--fs-sm);padding:4px 0;text-decoration:underline;text-underline-offset:2px}
.confflags{list-style:none;margin:8px 0 0;padding:0}

/* ---------- decisions ---------- */

.dtable th{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--border)}

.dtable .dbody{color:var(--muted);font-size:var(--fs-xs);margin-top:3px;max-width:420px}

/* ---------- slide-over ---------- */

}

.check{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--border)}

.blkpick{display:flex;flex-wrap:wrap;gap:5px}
.blkopt{border:1px solid var(--border);background:var(--panel);border-radius:15px;padding:2px 8px;font-size:var(--fs-xs);font-family:var(--mono);color:var(--muted)}

const NOW_SEED = "2026-07-24T00:00:00.000Z";

const SESSIONS_SEED = [
 { id:"s01", number:1, title:"Is a game a place?", block:"describe", lens:"",
   question:"What is a third place, and is the thing the client wants to build one?",
   provocation:{minutes:10, body:"Two images: a Wetherspoons at 4pm and a Discord voice channel. \"Which is a third place? Ninety seconds, and you must commit.\" Take the vote before any input; it is the first entry in the forecast log's informal precursor."},
   input:{minutes:30, body:"Oldenburg's eight characteristics, delivered fast and without hedging: neutral ground; leveller; conversation as the main activity; accessibility and accommodation; regulars; low profile; playful mood; a home away from home.\n\nThe terminological hazard, explicitly and on a slide: Oldenburg's *third place*, Soja's *Thirdspace* and Bhabha's *third space* are three unrelated literatures. The client means Oldenburg. Students will meet all three in search results and must not conflate them.\n\nThen test the client's proposal against the eight, live. Conversation as the main activity fails. The leveller fails. Neutral ground and accessibility are contested. Four of eight survive comfortably. Do not resolve this; name it as the course's opening problem.\n\nThen the inversion: Steinkuehler & Williams (2006), *JCMC* 11(4), argued that MMOs are structurally similar to Oldenburg's third places and function as sites of informal sociability and social capital; Ducheneaut, Moore & Nickell (2007), *CSCW* 16, made the case in a detailed venue study. So the *game* is already the third place, and the client is proposing a physical container for a virtual one. Ask the room to justify that, cold, with no reading. They will struggle, and should.\n\nClose with the client brief, delivered by the club (see decision D2).\n\nFinal slide, one number, no commentary: **Ungdata, n=70,695, ages 16–18, 2021–23 — 0.7% of girls and 8.8% of boys actively engage in e-sports.** Let it sit. Do not discuss it this week. Everything downstream depends on whether the club accepts it, and the students should carry it unresolved."},
   activity:{minutes:40, body:"**[OFF] Oldenburg card sort, gaming variant.** Twelve spaces × eight criteria, teams of four, score 0–2 on every criterion, then rank the twelve. The twelve: a Wetherspoons, a **Discord server**, a mosque, a commercial gym, a barbershop, a **PC bang**, a public library, a Costa, **a bedroom with a headset on**, a school corridor, a football terrace, **the proposed venue**.\n\nRanking forces the definitional fight into the open. Plenary on the three most contested: the bedroom with a headset, the school corridor, the proposed venue. The school corridor remains the productive case — it satisfies most criteria and is obviously not a third place, which exposes that Oldenburg's list is necessary but not sufficient. The bedroom is the case that generates the course."},
   artefact:{minutes:10, body:"First cards on the claim wall. Each team writes the definition it will operate with, and signs it. Revisable later, but only in writing."},
   fallback:"",
   readings:[
     {id:"r0101", citation:"Oldenburg & Brissett (1982), \"The third place\", Qualitative Sociology 5(4) — full, it is short", status:"to-set"},
     {id:"r0102", citation:"Steinkuehler & Williams (2006), JCMC 11(4) — MMOs as third places — full", status:"verified"},
     {id:"r0103", citation:"Ducheneaut, Moore & Nickell (2007), CSCW 16 — detailed venue study", status:"verified"},
     {id:"r0104", citation:"Ungdata, n=70,695, ages 16–18, 2021–23 — e-sports engagement (0.7% girls, 8.8% boys)", status:"unverified"}
   ],
   notes:"", confidenceFlags:["Ungdata e-sports figures (≈5% overall; 0.7% girls, 8.8% boys; n=70,695; ages 16–18; 2021–23) reported as published. Verify the exact citation before setting."],
   decisionRefs:["D1","D2","D9"] },

 { id:"s02", number:2, title:"Which decline?", block:"describe", lens:"",
   question:"Which decline are we talking about — supply, use, quality, or outcome?",
   provocation:{minutes:10, body:"One headline claim (\"third places are disappearing\") and four datasets that each support a different magnitude. Show of hands on the percentage decline, then reveal that the answer depends entirely on which thing is counted."},
   input:{minutes:30, body:"The four-way decomposition, taught as the analytical spine of the whole course.\n\n- **Supply** — venue counts and closures. Sun, Esposito, Sagehorn, Melendez & Finlay (2025), *Health & Place*: widespread third-place closures across the US 2019–21, varying by category and by rural/urban setting.\n- **Use** — time-use data. Kannan & Veazie (2023), *SSM — Population Health*: rising social isolation and falling companionship, ATUS 2003–2020, with pre-pandemic trends already declining. Twenge & Spitzberg (2020) on adolescent in-person interaction.\n- **Quality** — commercialisation, surveillance, sorting. Harder to measure; that is the point, not an apology.\n- **Outcome** — loneliness and belonging. Klinenberg has argued publicly that there is no good evidence Americans are lonelier than ever, while simultaneously documenting collapsing face-to-face time. Both can be true, and the students must be able to say why.\n\nAdd, for this iteration, a **fifth candidate**: digital substitution. Not a fifth column on the claim wall — it is a proposed *explanation*, and this session is still description. Park it explicitly for session 3 onward. Naming it and refusing to discuss it is the cleanest demonstration of the verb discipline the course will get.\n\nThen the measurement problem itself: Finlay et al. (2026), *Alzheimer's & Dementia*, show that the geospatial datasets used to count third places vary substantially in locational accuracy, categorical validity and coverage. The dataset determines the finding."},
   activity:{minutes:40, body:"**[HTML] Decline Lab.** Four synchronised panels — venue counts, minutes of face-to-face socialising, a constructed quality index, self-reported belonging — over 2000–2025. A definition selector lets students swing the headline figure from roughly −8% to −55% using the same underlying data. Second mode: \"build your own headline\" generates one defensible and one misleading sentence from an identical dataset; students must say which is which and why."},
   artefact:{minutes:10, body:"Claim wall's four columns populated for the first time. Assumption register opened."},
   fallback:"**[OFF] Four papers, four groups.** Each group takes one evidence type, twenty minutes, and presents the strongest possible case that *their* decline is the real one. Plenary adjudicates. Works nearly as well and costs nothing.",
   readings:[
     {id:"r0201", citation:"Sun, Esposito, Sagehorn, Melendez & Finlay (2025), Health & Place — US third-place closures 2019–21", status:"to-set"},
     {id:"r0202", citation:"Kannan & Veazie (2023), SSM — Population Health — social isolation, ATUS 2003–2020", status:"to-set"},
     {id:"r0203", citation:"Twenge & Spitzberg (2020) — adolescent in-person interaction", status:"to-set"},
     {id:"r0204", citation:"Klinenberg — loneliness evidence vs collapsing face-to-face time", status:"to-set"},
     {id:"r0205", citation:"Finlay et al. (2026), Alzheimer's & Dementia — geospatial dataset validity", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:[] },

 { id:"s03", number:3, title:"Belonging without conversation", block:"explain", lens:"Psychological, part one",
   question:"Why do humans need a room in which to be nobody in particular — and what happens when that room keeps score?",
   provocation:{minutes:10, body:"**[OFF] The alibi test.** In pairs: five minutes of conversation with no shared task, then five minutes of conversation while playing something trivially simple together. Rate difficulty and enjoyment on a slip. Collect. The gap between the two is the design principle the entire venue rests on, and students discover it in their own bodies before they meet it in a citation."},
   input:{minutes:30, body:"Baumeister & Leary (1995) on the need to belong as a fundamental motive. Festinger, Schachter & Back (1950) — the Westgate study, in which friendship formation was predicted by stairwell position and doorway orientation rather than by disposition. Zajonc on mere exposure; Milgram on the familiar stranger. Goffman (1963) on civil inattention — the skill of being near strangers without engaging them, which is what makes a third place restful rather than demanding.\n\nCacioppo & Hawkley: loneliness as social hypervigilance, not merely deficit. This is the session's payload, because it explains why opening a room does not fill it. A lonely adolescent entering an unfamiliar space is running threat detection, not seeking company.\n\nThen resolve session 1's failure of the conversation criterion. Either the client's space fails a core criterion of the theory it invokes, or the criterion is wrong. The second reading is the stronger one: a shared focal activity lowers the conversational demand of entry, which is precisely what an anxious fifteen-year-old needs. Gaming is a **sociable alibi**. Students who reach this themselves have done real theoretical work; do not hand it to them before the alibi test data are on the board.\n\nThe design implication is concrete and should be written on the claim wall this week: the space needs somewhere to **stop playing and still be present**, or it is a room of individuals.\n\nClose by opening the second failure — the leveller. Competitive gaming produces a visible, ranked, persistent skill hierarchy, and an equipment gradient on top of it. A teenager on a school laptop and a teenager on a 240Hz monitor are not equals in that room, and the ladder announces it publicly."},
   activity:{minutes:40, body:"**[HTML] The Ladder.** Twenty agents, heterogeneous skill and hardware, matchmaking on or off, ranking visible or hidden. Outputs: participation retention by skill decile, and time-to-quit for the bottom quartile. Students then redesign the matchmaking to retain the bottom quartile and discover what they must give up to do it. Directly attacks Oldenburg's leveller criterion with a mechanism rather than an assertion."},
   artefact:{minutes:10, body:"Assumption register founding entry: *\"teenagers will come if the space is open.\"* The register's canonical example of an assumption that reads as obvious and is not."},
   fallback:"**[OFF] Ladder without ranks.** Run a class tournament twice — once with a visible leaderboard, once with hidden results and randomised pairings. Compare participation in the final rounds. Cheap, noisy, and makes the same point.",
   readings:[
     {id:"r0301", citation:"Baumeister & Leary (1995) — the need to belong", status:"to-set"},
     {id:"r0302", citation:"Festinger, Schachter & Back (1950) — the Westgate study (propinquity)", status:"to-set"},
     {id:"r0303", citation:"Zajonc — mere exposure", status:"to-set"},
     {id:"r0304", citation:"Milgram — the familiar stranger", status:"to-set"},
     {id:"r0305", citation:"Goffman (1963) — civil inattention", status:"to-set"},
     {id:"r0306", citation:"Cacioppo & Hawkley — loneliness as social hypervigilance", status:"to-set"},
     {id:"r0307", citation:"Epley & Schroeder — connecting with strangers (optional set-work; demoted from activity)", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:["D11"] },

 { id:"s04", number:4, title:"Screens and the adolescent", block:"explain", lens:"Psychological, part two",
   question:"Why teenagers specifically — and how would we know whether screens are the problem?",
   provocation:{minutes:10, body:"\"Name every place you could legally and comfortably spend two hours, aged fifteen, without money and without an adult present.\" Silent list, two minutes. Count aloud. The number is usually one or zero."},
   input:{minutes:30, body:"*Development (12 min).* Blakemore on social brain development in adolescence and the reorientation toward peers. Steinberg's dual-systems account and the Chein et al. finding that peer presence specifically elevates adolescent risk-taking. Self-determination theory, which in this brief becomes central rather than useful: games are engineered to deliver competence and autonomy, so **the room must supply relatedness or it adds nothing the bedroom does not**. Autonomy is the design variable adult-designed youth spaces most reliably get wrong, because a space that is supervised, programmed and evaluated is by construction low in autonomy. Scannell & Gifford (2010) on place attachment gives the vocabulary for why a space becomes *theirs*.\n\n*Methods (18 min).* Haidt (2024), *The Anxious Generation*, set against Odgers's *Nature* review and Przybylski & Orben's specification-curve work. Then ICD-11 gaming disorder set against the substantial methodological critique of that literature. The purpose is not to settle either question. It is to show students what a real methodological disagreement looks like, conducted by people with skin in it, and to equip them for the fact that the club **will** be asked about gaming disorder and screen time by parents, funders and the municipality — and will also be asked, by anyone who has read the critiques, whether the diagnosis is well founded. Students must be able to hold both without collapsing into either.\n\nTwo minutes on flow, variable reward and stopping cues: a space with no natural end to a session has a safeguarding problem before it has a closing-time problem."},
   activity:{minutes:40, body:"**[HTML] Threshold, gaming variant.** A branching narrative of one teenager's first ninety seconds — pavement, door, threshold, first interaction — with social-anxiety modelling determining which branches are available. Three personas, run in sequence: a ranked player, a curious non-gamer, and a girl arriving alone into a room that is 90% male. The divergence in outcomes is the lesson. Cheapest build on the list; largest effect on what students recommend."},
   artefact:{minutes:10, body:"Steel-man file opened: each team drafts the strongest case that psychology is *not* the primary explanatory lens here."},
   fallback:"**[OFF] The autonomy audit.** Five real youth-space photographs. For each, list every decision a fifteen-year-old is permitted to make and every one that has been made for them. The ratio is usually appalling.",
   readings:[
     {id:"r0401", citation:"Blakemore — social brain development in adolescence", status:"to-set"},
     {id:"r0402", citation:"Steinberg — dual-systems account; Chein et al. — peer presence and risk-taking", status:"to-set"},
     {id:"r0403", citation:"Self-determination theory (Ryan & Deci) — competence, autonomy, relatedness", status:"to-set"},
     {id:"r0404", citation:"Scannell & Gifford (2010) — place attachment", status:"to-set"},
     {id:"r0405", citation:"Haidt (2024), The Anxious Generation", status:"to-set"},
     {id:"r0406", citation:"Odgers — Nature review; Przybylski & Orben — specification-curve analysis", status:"to-set"},
     {id:"r0407", citation:"ICD-11 gaming disorder and its methodological critique", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:[] },

 { id:"s05", number:5, title:"Who pays for twenty PCs?", block:"explain", lens:"Economic, part one",
   question:"Is a third place a public good, a club good, or a business — and what changes when the capital stock is obsolete in four years?",
   provocation:{minutes:10, body:"\"This space will cost 400,000 NOK a year to run. Who should pay, and what does your answer commit you to?\" Four options on the board, hands up, no discussion. Keep the tally; revisit in session 13."},
   input:{minutes:30, body:"Samuelson (1954) on public goods, then Buchanan (1965), \"An economic theory of clubs\" — excludability, congestion, optimal club size. This is the course's one genuine formal tool and it repays doing properly on a whiteboard: the marginal member confers a benefit up to a threshold and imposes a congestion cost beyond it, yielding an optimum that is neither one person nor everybody. The e-sports twist is that congestion is **hard-capped by seat count**, so the rationing question is unavoidable from day one rather than emergent.\n\nOstrom (1990) and the eight design principles, presented as a governance template to be reused in session 13. Hirschman (1970): a declining club loses its most demanding members first, which is why quality decay is self-accelerating — and in a gaming venue the most demanding members are the ranked players, whose departure is visible.\n\nThen the material specific to this brief:\n\n- **Hardware as capital with a brutal obsolescence cycle.** Twenty machines replaced every three to four years, plus peripherals, plus bandwidth, plus the fact that the machines lose function the moment a title's system requirements move. Contrast with a football pitch, which depreciates over decades. This changes the funding model entirely and students almost never anticipate it.\n- **The PC bang comparison.** Internet cafés collapsed across most of the West and persist at scale in South Korea. Candidate explanations: housing density and space per teenager, hardware cost relative to income, network effects, licensing. The best natural experiment available on whether physical gaming venues survive.\n- **The club's own economics.** E-sports for football clubs is usually a brand and audience play, not a profit centre. Ask who is really being served — and require students to make the case that this is legitimate rather than cynical before they are allowed to call it cynical."},
   activity:{minutes:40, body:"**[HTML] Club Economics, with rig module.** Students run the space: membership fee, per-session price, opening hours, capacity, staffing. The model includes congestion costs past a threshold, fixed costs with a Baumol drift, and four teenage segments with heterogeneous willingness to pay. Optimal club size emerges from play rather than from the lecture.\n\nThe rig module adds the capital problem: a hardware budget, a three-to-four-year obsolescence curve, bandwidth costs and a maintenance function. Students choose between fewer good machines and more mediocre ones, **and must fund year four**. Most first attempts are insolvent by month thirty.\n\nSecond phase, after twenty-five minutes: remove the ability to charge anything at all. Congestion must now be solved by rationing — booking, membership caps, invitation, queueing. Every solution they invent is a political one, and the next block arrives on its own."},
   artefact:{minutes:10, body:"Claim wall: the \"supply\" column gets its economic explanations."},
   fallback:"**[OFF] Silent budget auction.** Fixed NOK budget, twenty candidate features, sealed team bids. Reveals preference orderings and the free-rider problem in fifteen minutes with no technology. Run this as a companion even if the build ships.",
   readings:[
     {id:"r0501", citation:"Samuelson (1954) — public goods", status:"to-set"},
     {id:"r0502", citation:"Buchanan (1965), \"An economic theory of clubs\"", status:"to-set"},
     {id:"r0503", citation:"Ostrom (1990) — eight design principles", status:"to-set"},
     {id:"r0504", citation:"Hirschman (1970), Exit, Voice, and Loyalty", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:["D5","D6"] },

 { id:"s06", number:6, title:"The market for lingering", block:"explain", lens:"Economic, part two",
   question:"Where did the free seat go?",
   provocation:{minutes:10, body:"The cost of a cappuccino divided by the socially acceptable maximum occupancy of a café table. Present it as a rent — kroner per hour of belonging."},
   input:{minutes:30, body:"Commercial third places sell time indirectly through spend-per-seat norms. Baumol's cost disease as the quiet structural explanation of why staffed social space becomes relatively more expensive forever — students almost never find this themselves and it reframes closure as something other than negligence. Becker (1965) on the allocation of time: the teenage time budget as a constrained optimisation containing school, travel and part-time work. Anchor tenants and footfall externalities. And, closing the loop from session 2's parked fifth candidate, substitution toward a digital good with **near-zero marginal cost** — which is the economic statement of the client's problem.\n\nClose with non-market valuation — contingent valuation, willingness to pay — and why teenage WTP is a terrible proxy for social value."},
   activity:{minutes:40, body:"**[OFF] The price of sitting.** Teams leave the building. Within 400 metres, find every place a fifteen-year-old could sit indoors for one hour without spending money. Photograph each. Then cost the cheapest legitimate paid alternative. Return with two numbers: free seat-hours available, and the price of one purchased seat-hour.\n\nThis produces a figure the client can use directly and is the single most reliably transformative activity in the course. Run in central London the count is usually shockingly low. Do not substitute a build for it."},
   artefact:{minutes:10, body:"Assumption register: *\"the Norwegian equivalent of this count is different, and we do not know how.\"* Flag it for the client question set (D3)."},
   fallback:"",
   readings:[
     {id:"r0601", citation:"Baumol — cost disease", status:"to-set"},
     {id:"r0602", citation:"Becker (1965) — the allocation of time", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:["D13"] },

 { id:"s07", number:7, title:"Whose space?", block:"explain", lens:"Political, part one",
   question:"Who writes the rules of a space that looks public — and does it matter whether the space has walls?",
   provocation:{minutes:10, body:"Read aloud, without attribution, three clauses from a privately owned public space rulebook. Ask students to place each as a shopping centre, a public park, or a private estate. They will get it wrong."},
   input:{minutes:30, body:"Habermas (1962/1989) on the coffeehouse and the structural transformation of the public sphere, with Fraser's (1990) counterpublics critique attached immediately so the canonical account does not stand unchallenged. Sennett (1977) on the fall of public man. Lefebvre on the right to the city. Minton's *Ground Control* on the privatisation of British public space.\n\nHostile design: Rosenberger's typology, and the 2025 *Journal of Applied Youth Studies* analysis of how redesigned suburban Melbourne railway stations designed out young people through combined physical imposition, surveillance and regulation, reinforced by media discourse criminalising teenage presence.\n\nThen the extension this brief requires: **platform governance as POPS**. The rules of a Discord server are a private rulebook governing a space that presents as public, enforced by unaccountable volunteers, with no appeal. The Finnish case of a non-profit running a youth centre on a Discord server — the platformization of a youth centre — is the teaching case, because it makes governance concrete and exposes the technical-competence barrier to participation. *(Confidence: the case is real; author and date unverified — see §E.)*\n\nWhere this lands: Soukup (2006) on computer-mediated communication as a virtual third place, and the subsequent critique that Oldenburg's physical criteria transfer badly to virtual settings (Memarovic et al. 2014; McArthur & White 2016). The critique matters here because it is the strongest available argument *for* the client's proposition."},
   activity:{minutes:40, body:"**[OFF] Split forensics.** Half the class walks one street photographing and classifying anti-sit, anti-skate, anti-linger and anti-sleep features. The other half takes an actual estate rulebook — King's Cross, Granary Square, More London — **and** the community rules of a major gaming platform, and produces a list of every behaviour permitted in one and prohibited in the other, in both directions.\n\nReconvene. The three lists together are the political lens made physical, and the platform column is the one the client has not thought about.\n\n**Optional build, tier 2. [HTML] Moderation Commons.** Ostrom's eight principles applied to a server rather than a room: students set boundaries, sanctions, monitoring and conflict resolution, then face escalating incidents. Graduated sanctions outperform bans; unmonitored spaces degrade. If built, it displaces the hostile design walk, not the rulebook forensics."},
   artefact:{minutes:10, body:"Claim wall: the \"quality\" column, thin until now, finally fills."},
   fallback:"",
   readings:[
     {id:"r0701", citation:"Habermas (1962/1989) — structural transformation of the public sphere", status:"to-set"},
     {id:"r0702", citation:"Fraser (1990) — counterpublics critique", status:"to-set"},
     {id:"r0703", citation:"Sennett (1977) — The Fall of Public Man", status:"to-set"},
     {id:"r0704", citation:"Lefebvre — the right to the city", status:"to-set"},
     {id:"r0705", citation:"Minton — Ground Control (privatisation of British public space)", status:"to-set"},
     {id:"r0706", citation:"Rosenberger — hostile design typology", status:"to-set"},
     {id:"r0707", citation:"Journal of Applied Youth Studies (2025) — Melbourne railway stations designing out youth", status:"to-set"},
     {id:"r0708", citation:"Finnish non-profit youth centre on Discord — platformization case (author/date unverified)", status:"unverified"},
     {id:"r0709", citation:"Soukup (2006) — CMC as a virtual third place; Memarovic et al. (2014); McArthur & White (2016) — the transfer critique", status:"to-set"}
   ],
   notes:"", confidenceFlags:["Discord-as-third-place and the Finnish youth-centre case: real, but author names and dates unconfirmed. Check before setting.","Red Bull Gaming Sphere / London gaming venues: high sector churn and a 16+ policy per published material — confirm hours, access and age policy directly before booking."],
   decisionRefs:["D13"] },

 { id:"s08", number:8, title:"Power and the young", block:"explain", lens:"Political, part two",
   question:"Is a youth club participation or containment — and who is excluded by an activity rather than by a door?",
   provocation:{minutes:10, body:"\"Your recommendation will be implemented by adults, funded by adults, evaluated by adults, and used by teenagers. At which of those four points does a young person get a vote?\""},
   input:{minutes:30, body:"Arnstein (1969) on the ladder of citizen participation, then Hart (1992) on children's participation as the operational version for this brief — manipulation, decoration and tokenism occupy the bottom three rungs and describe most real youth consultation. Coussée, Roets & De Bie (2009), \"Empowering the powerful\": youth work systematically reaches the young people who were already included. Teach this without softening; it is the necessary counterweight to client optimism.\n\nThen return to session 1's number and do not leave it. Craig, Prior and colleagues (2020), *Social Inclusion* 8(3), found stakeholders across publishers, teams and sport-for-development organisations simultaneously claiming inclusion as e-sports' defining virtue and identifying gendered toxicity as its embedded problem. Rusk & Ståhl and others characterise competitive gaming's norms as technomasculine; Witkowski on gendered presence in competitive gaming. In the Ungdata data, female e-sports players differ noticeably from non-players on almost all measured indicators, while among boys players and non-players look broadly similar — which suggests that for girls, participation is selective in a way it is not for boys.\n\nState the conclusion plainly: **on current Norwegian base rates, an e-sports space is a boys' space, by a factor of more than ten, and this is not a moderation-policy problem solvable with a code of conduct on the wall.** Whether the club treats that as a design fault or an accepted scope is the club's decision to make deliberately (D1) — but the students' job is to make sure it is made, not discovered.\n\nNordic context: universalism versus targeting, municipal responsibility for youth provision, and Ungdata as a governance instrument as much as a research one. Norwegian youth policy is unusually evidence-linked, which raises rather than lowers the stakes on what counts as evidence."},
   activity:{minutes:40, body:"**[OFF] Stakeholder table.** Five asymmetric roles with private, conflicting mandates: the club, the municipality, the teenagers, a local business association, parents. Four rounds to agree a specification and a budget. The municipality has a statutory duty and a deficit; the business association wants footfall and no congregation; the teenagers want somewhere unsupervised.\n\nDebrief against Hart's ladder: which rung did the teenagers actually occupy in the deal that was struck?\n\n**Do not build the multiplayer version.** Paper role-play performs acceptably and the infrastructure cost is disproportionate.\n\n**Companion, 15 min if the role-play finishes early. [OFF] The girl's seat.** Redesign the space, the programming and the recruitment so the 0.7% figure could plausibly move. Constraint: teams may not simply propose a girls-only night without justifying why segregation is the right instrument. Carry the output into session 13."},
   artefact:{minutes:10, body:"Steel-man file: the case that this is containment dressed as provision."},
   fallback:"",
   readings:[
     {id:"r0801", citation:"Arnstein (1969) — ladder of citizen participation", status:"to-set"},
     {id:"r0802", citation:"Hart (1992) — children's participation (operational ladder)", status:"to-set"},
     {id:"r0803", citation:"Coussée, Roets & De Bie (2009), \"Empowering the powerful\"", status:"to-set"},
     {id:"r0804", citation:"Craig, Prior et al. (2020), Social Inclusion 8(3) — inclusion vs gendered toxicity in e-sports", status:"to-set"},
     {id:"r0805", citation:"Rusk & Ståhl — technomasculine norms; Witkowski — gendered presence in competitive gaming", status:"to-set"}
   ],
   notes:"", confidenceFlags:["On current Norwegian base rates an e-sports space serves boys >10:1 — rests on the Ungdata e-sports figures; verify that citation before setting."],
   decisionRefs:["D1","D11"] },

 { id:"s09", number:9, title:"Adjudicating explanations", block:"adjudicate", lens:"",
   question:"How would we know which lens is right?",
   provocation:{minutes:10, body:"Three one-sentence explanations of third-place decline, one per lens, all plausible. \"Design an observation that would come out differently depending on which is true.\" Most students cannot, initially, and should feel that."},
   input:{minutes:30, body:"A method, not a literature. Causal mapping: nodes, directed edges, sign and estimated strength. Then diagnostic reasoning — the move from *my explanation is consistent with the evidence* to *my explanation predicts something the others do not*. Introduce the key assumptions check and analysis of competing hypotheses as formal techniques.\n\nWorked example: if third-place decline is driven primarily by commercial rent (economic), by digital substitution (psychological), or by the privatisation of public space (political), the three predict different patterns across venue types, across countries with different property regimes, and across age cohorts. Those differential predictions are testable, and the PC bang case from session 5 is a live instance."},
   activity:{minutes:40, body:"**[OFF] Competing hypotheses matrix.** Hypotheses as columns, available evidence as rows, cells marked consistent / inconsistent / non-diagnostic. The discipline is that evidence consistent with *everything* is worthless, and students always begin with a matrix full of it.\n\nSecond half: each team designs one diagnostic test that could be run, in principle and with real data, to discriminate between two lenses. Ten minutes, then present."},
   artefact:{minutes:10, body:"Claim wall reorganised: cards move to \"diagnostic evidence\" or are demoted."},
   fallback:"",
   readings:[],
   notes:"", confidenceFlags:[],
   decisionRefs:[] },

 { id:"s10", number:10, title:"What actually works", block:"adjudicate", lens:"",
   question:"Does building the thing help?",
   provocation:{minutes:15, body:"**Provocation and forecast (15).** Before any input, every student records a probabilistic prediction in the forecast log:\n\n> A new municipal youth club opens in a comparable Nordic urban district. Two years later, has young people's satisfaction with their local environment improved detectably relative to comparison districts? Give a probability.\n\nCollect before proceeding. No discussion first. This is not negotiable — the reveal is worthless if the numbers are not already on paper."},
   input:{minutes:40, body:"**Input (25).** Coalter (2007), \"Sports clubs, social capital and social regeneration: 'ill-defined interventions with hard to follow outcomes'?\" — the title is the argument. Coalter (2013) and Coalter & Theeboom (2025) on sport-for-development's evidentiary problems. Then the evaluation machinery: selection into attendance, regression to the mean, secular trend, deadweight, attribution, and why pre-post designs on voluntary programmes almost always show gains.\n\nAdd the escalation specific to this brief: **e-sports-for-development inherits every evidential weakness of sport-for-development while being younger and less evaluated.** Pair with the capabilities-based e-sports-for-development model in the *Journal of Electronic Gaming and Esports* (2023), which is explicitly untested — a rare chance to show students a framework that openly asks to be falsified.\n\n**The reveal (15).** A difference-in-differences study of the Fubiak leisure club, established at Furuset in Alna district, Oslo, in 2016, using Ung i Oslo cross-sections from 2015 and 2018, found no significant difference in the development of young people's satisfaction with their local environment between Alna and the rest of Oslo — neither among youth in general nor within socio-economic subgroups (*Nordic Journal of Urban Studies* 4(1)). The paper explicitly notes how few studies of leisure-club impact exist.\n\nScore the forecasts on the spot. Then sit with it: the students are about to recommend building something whose closest evaluated analogue produced nothing measurable.\n\nBalance it honestly, in the same breath. Kleppang & Skille (2022), *IJERPH* 19(17): 10769, using Ungdata 2017–19, find that lower participation in organised sports and unorganised physical activity is associated with higher odds of depressive symptoms — but the direction of causation is exactly what a cross-sectional design cannot establish. Zahnow (2024) finds social infrastructure access associated with cohesion and wellbeing in a nationally representative Australian sample. Association is abundant; identification is scarce."},
   activity:{minutes:35, body:"**[HTML] Evaluation Trap.** Students design and \"run\" an evaluation of a new youth club. They see a large, satisfying pre-post improvement. Then they unlock, one at a time, selection into attendance, regression to the mean, the secular trend, and finally the difference-in-differences estimate. The headline gain evaporates in stages. Ends by returning their own Brier score from the forecast."},
   artefact:{minutes:0, body:"Forecast log scored. Assumption register gains its most important row: *\"we assume this intervention has an effect.\"*"},
   fallback:"",
   readings:[
     {id:"r1001", citation:"Coalter (2007) — \"ill-defined interventions with hard to follow outcomes\"", status:"to-set"},
     {id:"r1002", citation:"Coalter (2013); Coalter & Theeboom (2025) — sport-for-development evidence", status:"to-set"},
     {id:"r1003", citation:"Journal of Electronic Gaming and Esports (2023) — capabilities-based e-sports-for-development model (explicitly untested)", status:"to-set"},
     {id:"r1004", citation:"Fubiak/Furuset difference-in-differences study, Nordic Journal of Urban Studies 4(1)", status:"unverified"},
     {id:"r1005", citation:"Kleppang & Skille (2022), IJERPH 19(17):10769 — participation and depressive symptoms", status:"to-set"},
     {id:"r1006", citation:"Zahnow (2024) — social infrastructure, cohesion and wellbeing", status:"to-set"}
   ],
   notes:"", confidenceFlags:["Fubiak/Furuset difference-in-differences finding: accurate as to design, data and result; author names unverified."],
   decisionRefs:["D10"] },

 { id:"s11", number:11, title:"Northern Norway, online", block:"intervene", lens:"",
   question:"What does this specific context change?",
   provocation:{minutes:10, body:"A photograph of Tromsø at noon in December. \"Design a youth programme for this.\""},
   input:{minutes:30, body:"*Geography and demography.* Latitude around 69°N, polar night from roughly late November to mid-January, extreme seasonal swing in daylight and temperature, and the transport consequences for a fifteen-year-old without a car. Northern Norway holds under a tenth of Norway's population across nearly a third of its land area, with sustained depopulation pressure; Finnmark and Nord-Troms are designated an action zone with tax relief and student loan write-offs explicitly aimed at retention. *(Verify figures against Statistics Norway before slides — see §E.)*\n\nReframe accordingly: teenage retention in the north is a **regional policy** problem as much as a wellbeing one, which is the argument most likely to interest the club's funders.\n\n*The double-edged case.* In a region of low density and long winters, distance is the binding constraint on physical sociability and the internet is the *existing solution*. The case for a physical gaming venue in the north is therefore simultaneously **stronger** than in a dense southern city — it competes not with an alternative social life but with none — and **weaker**, because the online option is already established, free, and has better hardware. Students must argue both sides before choosing.\n\n*Infrastructure and institutions.* Bandwidth and latency to Nordic game servers; transport after school in winter darkness; the school-week rhythm; municipal responsibility for youth provision; the framework conditions for leisure clubs reviewed by NTNU Social Research for the Ministry of Children and Families (2023); participation-fee barriers and the fritidskort pilots; Norwegian upper-secondary e-sports programmes; Ungdata as the available local evidence base. Whether e-sports counts as sport for Norwegian public funding purposes is **not verified — do not assert either way in class** (D7).\n\n*Psychology of season.* Leibowitz and Vittersø on positive wintertime mindset in Tromsø — framing the polar night as an opportunity rather than an ordeal is associated with better wellbeing. *(Verify citation; roughly 80% confident on substance.)* If it holds it is a design instruction, not a curiosity: the space should be **of** the winter, not a refuge from it.\n\nIf Sámi young people fall within the catchment, this is where that is addressed — seriously, with a guest voice if at all possible, and not as an exotic footnote (D8)."},
   activity:{minutes:40, body:"**[HTML] Polar Night Planner, e-sports variant.** Seasonal demand model: daylight hours by week at 69°N, temperature, school calendar, transport availability, darkness-related attendance elasticity. Students schedule a year of programming against a fixed budget. The naive plan front-loads summer and dies in January; the good plan does the opposite.\n\nAdded axis for this brief: for each week, **what fraction of the target group's gaming would have happened anyway, at home?** The tool must make displacement visible, because the client's business case depends on it — and it hands students the concept that session 13's keystone build then formalises.\n\n**Second activity, non-negotiable, 15 min inside the artefact slot. Write the client question set.** Students draft the questions they would ask catchment teenagers — gamers and non-gamers — if they could. This is the input to D3 and, if the club agrees, the material for session 12."},
   artefact:{minutes:10, body:"Assumption register: the \"what we cannot know from London\" column gets its heaviest session."},
   fallback:"**[OFF]** Paper year-planner on a fixed budget with a printed daylight-and-temperature table. Loses the elasticity model, keeps the lesson.",
   readings:[
     {id:"r1101", citation:"NTNU Social Research for the Ministry of Children and Families (2023) — leisure-club framework conditions", status:"to-set"},
     {id:"r1102", citation:"Leibowitz and Vittersø — positive wintertime mindset in Tromsø", status:"unverified"},
     {id:"r1103", citation:"Statistics Norway — Northern Norway demographics and action-zone figures (secondary reporting)", status:"unverified"}
   ],
   notes:"", confidenceFlags:[
     "Northern Norway demographic and action-zone figures: secondary reporting; verify against Statistics Norway before slides.",
     "Leibowitz and Vittersø on Tromsø wintertime mindset: ~80% confident on substance, less on publication details.",
     "Whether e-sports qualifies as sport for Norwegian public funding: not verified. Do not assert either way in class (D7)."
   ],
   decisionRefs:["D3","D7","D8","D11"] },

 { id:"s12", number:12, title:"Listening", block:"intervene", lens:"",
   question:"What do the people who would use it actually say?",
   provocation:{minutes:5, body:"*Access position, stated plainly.* Students do not have access to teenagers in the client's catchment. Catchment-specific voice is recoverable only through the club (D3): the club administers the session-11 question set locally and returns recordings or transcripts. A teenage panel is still available in London and is worth having on its own terms, but it cannot supply Norwegian base rates and must not be allowed to imply that it can.\n\n**Provocation (5).** Read out three verbatim lines from published Ungdata material. \"Who said this, and what would you have designed differently if you had heard it first?\""},
   input:{minutes:20, body:"Structured secondary listening as a method: what published survey findings can and cannot tell you; the difference between what a respondent ticks and what a respondent means; practitioner accounts as evidence with a known bias direction. Then the recruitment problem — Coussée et al. from session 8 applies to *listening* as much as to provision, and the teenagers most easily reached are the least informative about non-attendance."},
   activity:{minutes:55, body:"**Activity A (30). [OFF] The empty chair.** One student plays a Norwegian fifteen-year-old who has never attended anything organised in their life. Teams pitch to the chair. The chair's only job is to explain why they would not come. **Rotate so every student occupies the chair once** — the shift in what students recommend after sitting in it is the most reliable attitude change in the course.\n\n**Activity B (25). [OFF] Interview synthesis.** Raw material → themes → design implications, done explicitly and visibly rather than intuitively. The discipline: every design implication must be traceable to a specific thing someone said, and the trace must be written down. If local material has been returned, it is used here; if not, published practitioner accounts and recorded interviews substitute."},
   artefact:{minutes:10, body:"Steel-man file updated against what was actually heard, and a written note in the assumption register of every claim that survived *only* because nobody in the catchment was there to contradict it. That note goes into the deliverable verbatim."},
   fallback:"",
   readings:[
     {id:"r1201", citation:"Ungdata — published survey material (verbatim lines and findings)", status:"to-set"},
     {id:"r1202", citation:"Coussée, Roets & De Bie (2009) — the recruitment problem applied to listening", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:["D3","D11","D14"] },

 { id:"s13", number:13, title:"Options", block:"intervene", lens:"",
   question:"What could be built, at what cost, and does it add contact or move it?",
   provocation:{minutes:10, body:"\"You have one building, one budget and one year. Name the single decision that matters most.\" Collect, keep, revisit in session 15."},
   input:{minutes:25, body:"Options appraisal as a form: a do-nothing baseline, three to five real alternatives, costs and benefits stated in the same units where possible and honestly separated where not. The do-nothing baseline is not a formality — given session 10, it is a live contender.\n\nOstrom's design principles reintroduced as a governance specification: boundaries, congruence with local conditions, collective-choice arrangements, monitoring, graduated sanctions, conflict resolution, recognised rights to organise, nested enterprises. A youth space with no answer to *who decides the rules and who enforces them* is not yet designed.\n\nPhysical design evidence: Whyte on movable seating, edges, triangulation and the sociability of small spaces; Jacobs on eyes on the street; Festinger's propinquity findings applied to circulation and thresholds.\n\n**Design brief constraints, issued this session and binding on the deliverable.** Every option must specify:\n- a **non-play space** — somewhere to stop playing and still be present (session 3);\n- its position on the **rationing** question (session 5);\n- its position on the **ranking and hardware gradient** (session 3);\n- what it does about the **0.7% figure**, including \"nothing, and here is why that is an acceptable scope\" as a permitted answer if argued (session 8, D1);\n- a **year-four hardware replacement** line (session 5);\n- what it would take to **detect** whether it worked (session 10)."},
   activity:{minutes:45, body:"**[HTML] Displacement Lab.** *The keystone build for this brief.* Students set capacity, hours and programming, then watch two counters: total social contact hours in the town, and contact hours **at the venue**. The naive design moves the second up and leaves the first flat — the teenagers who come are the ones already gaming together. Sliders for outreach intensity, activity mix and threshold friction let students find configurations that add contact rather than relocate it.\n\nThis tool exists to make substitution visible and is deliberately withheld until the intervene block: it answers *does the venue add anything*, which is an intervention question. Running it earlier would breach the verb order.\n\n**Companion, [OFF], 20 min, mandatory. Hardware Fermi.** Catchment population → eligible teenagers → realistic penetration rate → attendance per session → staffing ratio → **cost per contact hour**. Then compare that number with a football pitch, a library and a bus pass. The comparison is the argument.\n\n**Deferred to tier 2. [HTML] Room Designer.** Grid layout, thresholds, seating, sightlines, agents with three motives — be seen, avoid being seen, do something — scored on dwell time and cross-group contact, with Whyte's findings encoded. High value, but Displacement Lab and the Fermi carry this session, and paper layouts are an adequate substitute."},
   artefact:{minutes:10, body:"First draft options table on the wall, costed, with the do-nothing baseline in the first row."},
   fallback:"",
   readings:[
     {id:"r1301", citation:"Ostrom — eight design principles (governance specification)", status:"to-set"},
     {id:"r1302", citation:"Whyte — movable seating, edges, triangulation, small spaces", status:"to-set"},
     {id:"r1303", citation:"Jacobs — eyes on the street", status:"to-set"},
     {id:"r1304", citation:"Festinger — propinquity applied to circulation and thresholds", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:["D1","D4","D5","D6","D7","D9","D10","D12"] },

 { id:"s14", number:14, title:"Red team", block:"intervene", lens:"",
   question:"What is wrong with our answer?",
   provocation:{minutes:5, body:"\"It is 2029. The space has closed. Write the first sentence of the news story.\""},
   input:{minutes:15, body:"Pre-mortem method (Klein): assume failure has occurred, then generate causes. It outperforms risk-listing because it removes the social cost of pessimism. Then the protocol: teams under attack do not defend."},
   activity:{minutes:60, body:"**[OFF] Structured adversarial review.** Rotating, three rounds of twenty minutes. Each proposal is attacked by a team assigned a specific lens:\n\n- **Psychological red team** — will anyone cross the threshold; what happens to the bottom quartile of the ladder; where do you stop playing and still belong.\n- **Economic red team** — who pays in year three when the capital grant is spent; what happens in year four when the machines age out; what is your cost per contact hour and what does it compare with.\n- **Political red team** — who was excluded by the design rather than by the door; who decides the rules and who enforces them; what rung of Hart's ladder did the teenagers occupy.\n\nRules: the proposing team may ask clarifying questions only. No defending. All criticism written down verbatim.\n\nFinal ten minutes: each team identifies the single criticism it cannot answer, and states what it will do about it."},
   artefact:{minutes:10, body:"Steel-man file closed and submitted. Assumption register finalised into the register that accompanies the deliverable."},
   fallback:"",
   readings:[
     {id:"r1401", citation:"Klein — the pre-mortem method", status:"to-set"}
   ],
   notes:"", confidenceFlags:[],
   decisionRefs:[] },

 { id:"s15", number:15, title:"The pitch", block:"intervene", lens:"",
   question:"Does it survive contact with the client?",
   provocation:{minutes:0, body:"**Format.** Client present, in person or by video, with at least one other adversarial questioner — a practitioner guest is ideal (D2, D11)."},
   input:{minutes:0, body:""},
   activity:{minutes:70, body:"**Structure (70).** Ten minutes per team: five presenting, five under questioning. Every deliverable must contain, and every pitch must state:\n\n1. The causal mechanism claimed.\n2. The assumed magnitude of the effect, with a stated basis.\n3. What evidence would falsify it.\n4. **What the club must find out locally that this course could not establish from London.**\n\nPoint four is what clients value most and what students most want to omit. Given the access constraint, it is also this cohort's largest single contribution, and it should be scored accordingly."},
   artefact:{minutes:20, body:"**Close (20).** Forecast log returned with Brier scores, including the session-10 forecast and any interim ones. Revisit session 13's \"single decision that matters most\" — did any team's answer survive?\n\nThen the course's actual lesson, stated plainly: the three lenses do not combine into one answer. They constrain each other. A recommendation that is psychologically sound, economically unsustainable and politically impossible is not a partial success."},
   fallback:"",
   readings:[],
   notes:"", confidenceFlags:[],
   decisionRefs:["D2","D11","D12"] }
];

/* =================================================================
   State + persistence
   ================================================================= */
let state, ui, saveTimer=null, undoSnapshot=null, toastTimer=null;

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function defaultUI(){
  return { view:"board", theme:"auto", currentSession:"s01",
    filters:{blocks:[],types:[],tiers:[],owners:[],blockedOnly:false,overdueOnly:false,unassignedOnly:false,search:""},
    collapsed:{}, menuOpen:false };
}

function loadUI(){
  try{ const raw=localStorage.getItem(LS_UI); if(raw){ return Object.assign(defaultUI(), JSON.parse(raw)); } }catch(e){}
  return defaultUI();
}
function saveUI(){ try{ localStorage.setItem(LS_UI, JSON.stringify(ui)); }catch(e){} }

function normalize(d){
  d.meta = Object.assign({courseTitle:"",cohort:"",startDate:null,sessionsPerWeek:1,lastExport:null}, d.meta||{});
  d.sessions = d.sessions||[]; d.assets = d.assets||[]; d.decisions = d.decisions||[];
  d.assets.forEach(a=>{
    if(!("blockedBy" in a)) a.blockedBy=[];
    if(!("checklist" in a)) a.checklist=[];
    if(!("notes" in a)) a.notes="";
    if(!("owner" in a)) a.owner="";
    if(!("due" in a)) a.due=null;
    if(!("effort" in a)) a.effort=null;
    if(!("tier" in a)) a.tier=null;
    if(!("updatedAt" in a)) a.updatedAt=NOW_SEED;
  });
  d.sessions.forEach(s=>{
    ["provocation","input","activity","artefact"].forEach(k=>{ if(!s[k]) s[k]={minutes:0,body:""}; });
    if(!s.readings) s.readings=[];
    if(!s.confidenceFlags) s.confidenceFlags=[];
    if(!s.decisionRefs) s.decisionRefs=[];
    if(!("notes" in s)) s.notes="";
    if(!("lens" in s)) s.lens="";
  });
  return d;
}

function loadData(){
  let raw;
  try{ raw = localStorage.getItem(LS_DATA); }catch(e){ raw=null; }
  if(!raw){ state = normalize(clone(SEED)); saveData(true); return; }
  let parsed=null;
  try{ parsed = JSON.parse(raw); }
  catch(e){
    // corrupt — never discard; keep the raw blob then seed
    backupRaw(raw); state = normalize(clone(SEED)); saveData(true); return;
  }
  if(!parsed || parsed.schemaVersion !== SCHEMA_VERSION){
    backupRaw(raw);
    parsed = migrate(parsed);
  }
  state = normalize(parsed);
}
function backupRaw(raw){
  try{ localStorage.setItem("courseTracker.backup."+Date.now(), raw); }catch(e){}
}
function migrate(d){
  if(!d || typeof d!=="object") return clone(SEED);
  // Only v1 exists; future migrations chain here. Preserve unknown fields.
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}
function saveData(immediate){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  const doWrite=()=>{ try{ localStorage.setItem(LS_DATA, JSON.stringify(state)); }catch(e){ console.error("save failed",e); } };
  if(immediate){ doWrite(); return; }
  saveTimer = setTimeout(doWrite, 400);
}

/* =================================================================
   Undo (single level)
   ================================================================= */
function captureUndo(label){ undoSnapshot = {label, data:clone(state)}; }
function commitUndo(){ if(undoSnapshot) showToast(undoSnapshot.label, ()=>{
  state = normalize(undoSnapshot.data); undoSnapshot=null; saveData(true); render();
}); }
function showToast(label, onUndo){
  const t=document.getElementById("toast");
  t.innerHTML="";
  const span=document.createElement("span"); span.textContent=label; t.appendChild(span);
  if(onUndo){ const b=document.createElement("button"); b.textContent="Undo"; b.onclick=()=>{ onUndo(); hideToast(); }; t.appendChild(b); }
  t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast, 8000);
}
function hideToast(){ document.getElementById("toast").classList.remove("show"); }

/* =================================================================
   Helpers
   ================================================================= */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function el(tag, attrs, children){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k==="text") e.textContent=attrs[k];
    else if(k.startsWith("on") && typeof attrs[k]==="function") e.addEventListener(k.slice(2), attrs[k]);
    else if(k==="dataset"){ for(const dk in attrs[k]) e.dataset[dk]=attrs[k][dk]; }
    else if(attrs[k]!=null && attrs[k]!==false) e.setAttribute(k, attrs[k]);
  }
  if(children!=null){ (Array.isArray(children)?children:[children]).forEach(c=>{ if(c==null)return; e.appendChild(typeof c==="string"?document.createTextNode(c):c); }); }
  return e;
}
function sessionById(id){ return state.sessions.find(s=>s.id===id); }
function assetsForSession(id){ return state.assets.filter(a=>a.sessionId===id); }
function segMinutes(s){ return ["provocation","input","activity","artefact"].reduce((n,k)=>n+(Number(s[k].minutes)||0),0); }
function initials(name){ if(!name) return ""; return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function isOverdue(due){ return due && due < todayISO(); }
function nextAssetId(){
  let max=0; state.assets.forEach(a=>{ const m=/^a(\d+)$/.exec(a.id); if(m) max=Math.max(max,+m[1]); });
  return "a"+String(max+1).padStart(2,"0");
}
function nextId(prefix){ return prefix + Math.random().toString(36).slice(2,8); }
function touch(a){ a.updatedAt = new Date().toISOString(); }

// minimal markdown: **bold**, *italic*, "- " bullets, "> " blockquote
function mdInline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
}
function mdRender(raw){
  if(!raw) return "";
  const lines=String(raw).split("\n"); let out=""; let inList=false;
  for(const line of lines){
    if(/^\s*-\s+/.test(line)){ if(!inList){out+="<ul>";inList=true;} out+="<li>"+mdInline(line.replace(/^\s*-\s+/,""))+"</li>"; continue; }
    if(inList){ out+="</ul>"; inList=false; }
    if(/^\s*>\s?/.test(line)){ out+="<blockquote>"+mdInline(line.replace(/^\s*>\s?/,""))+"</blockquote>"; continue; }
    if(line.trim()===""){ continue; }
    out+="<p>"+mdInline(line)+"</p>";
  }
  if(inList) out+="</ul>";
  return out;
}

function render(){
  applyTheme();
  const r=root(); r.innerHTML="";
  r.appendChild(renderTopbar());
  const v=el("div",{class:"view view-"+ui.view});
  if(ui.view==="board") v.appendChild(renderBoard());

}

function applyTheme(){
  const rootEl=document.documentElement;
  if(ui.theme==="auto") rootEl.removeAttribute("data-theme");
  else rootEl.setAttribute("data-theme", ui.theme);
}
