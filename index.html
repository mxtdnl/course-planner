   BOARD
   ================================================================= */
function ownerList(){
  const set=new Set(); state.assets.forEach(a=>{ if(a.owner) set.add(a.owner); });
  return [...set].sort();
}
function assetMatches(a){
  const f=ui.filters;
  const s = a.sessionId?sessionById(a.sessionId):null;
  if(f.blocks.length){ if(!s || !f.blocks.includes(s.block)) return false; }
  if(f.types.length && !f.types.includes(a.type)) return false;
  if(f.tiers.length && !f.tiers.includes(String(a.tier))) return false;
  if(f.owners.length && !f.owners.includes(a.owner)) return false;
  if(f.blockedOnly && a.status!=="blocked") return false;
  if(f.overdueOnly && !isOverdue(a.due)) return false;
  if(f.unassignedOnly && a.owner) return false;
  if(f.search){
    const q=f.search.toLowerCase();
    const hay=(a.title+" "+(a.notes||"")).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function anyFilterActive(){
  const f=ui.filters;
  return f.blocks.length||f.types.length||f.tiers.length||f.owners.length||f.blockedOnly||f.overdueOnly||f.unassignedOnly||f.search;
}

function renderBoard(){
  const wrap=el("div",{});
  wrap.appendChild(renderFilters());
  const board=el("div",{class:"board", id:"board"});
  STATUSES.forEach(st=>board.appendChild(renderColumn(st)));
  wrap.appendChild(board);
  return wrap;
}
function refreshBoard(){
  const old=document.getElementById("board"); if(!old) return;
  const nb=el("div",{class:"board", id:"board"});
  STATUSES.forEach(st=>nb.appendChild(renderColumn(st)));
  old.replaceWith(nb);

}

  TYPES.forEach(t=>g2.appendChild(el("button",{class:"pill"+(f.types.includes(t.id)?" on":""), onclick:()=>toggleF("types",t.id)}, t.label)));

  // tier
  const g3=el("div",{class:"fgroup"},[el("span",{class:"fglabel",text:"Tier"})]);
  ["1","2","3","null"].forEach(t=>g3.appendChild(el("button",{class:"pill"+(f.tiers.includes(t)?" on":""), onclick:()=>toggleF("tiers",t)}, t==="null"?"—":t)));
  bar.appendChild(g3); bar.appendChild(el("div",{class:"fdiv"}));
  // owner
  const owners=ownerList();
  if(owners.length){
    const g4=el("div",{class:"fgroup"},[el("span",{class:"fglabel",text:"Owner"})]);
    owners.forEach(o=>g4.appendChild(el("button",{class:"pill"+(f.owners.includes(o)?" on":""), onclick:()=>toggleF("owners",o)}, o)));

  const g5=el("div",{class:"fgroup"});
  g5.appendChild(el("button",{class:"pill"+(f.blockedOnly?" on":""), onclick:()=>toggleBool("blockedOnly")}, "Blocked only"));
  g5.appendChild(el("button",{class:"pill"+(f.overdueOnly?" on":""), onclick:()=>toggleBool("overdueOnly")}, "Overdue only"));
  g5.appendChild(el("button",{class:"pill"+(f.unassignedOnly?" on":""), onclick:()=>toggleBool("unassignedOnly")}, "Unassigned only"));
  bar.appendChild(g5);
  if(anyFilterActive()) bar.appendChild(el("button",{class:"clearf", onclick:clearFilters}, "Clear filters"));
  return bar;
}
function toggleF(key,val){ const arr=ui.filters[key]; const i=arr.indexOf(val); if(i<0)arr.push(val); else arr.splice(i,1); saveUI(); render(); }
function toggleBool(key){ ui.filters[key]=!ui.filters[key]; saveUI(); render(); }
function clearFilters(){ ui.filters=defaultUI().filters; const sb=document.getElementById("search"); if(sb)sb.value=""; saveUI(); render(); }

function renderColumn(st){
  const collapsed=!!ui.collapsed[st.id];
  const all=state.assets.filter(a=>a.status===st.id);
  const shown=all.filter(assetMatches);
  const col=el("div",{class:"col"+(collapsed?" collapsed":""), dataset:{status:st.id}});
  col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("dragover"); });
  col.addEventListener("dragleave",()=>col.classList.remove("dragover"));
  col.addEventListener("drop",e=>{ e.preventDefault(); col.classList.remove("dragover"); const id=e.dataTransfer.getData("text/plain"); moveAsset(id, st.id); });

  const head=el("div",{class:"colhead", onclick:()=>{ ui.collapsed[st.id]=!collapsed; saveUI(); render(); }});
  head.appendChild(el("span",{class:"dot", style:"background:var(--st-"+st.id+"-bg);box-shadow:0 0 0 1px var(--st-"+st.id+"-br) inset"}));
  head.appendChild(el("span",{class:"name",text:st.label}));
  const cnt = anyFilterActive() ? (shown.length+" of "+all.length) : String(all.length);
  head.appendChild(el("span",{class:"cnt mono",text:cnt}));
  col.appendChild(head);

  if(!collapsed){
    const list=el("div",{class:"collist"});
    shown.forEach(a=>list.appendChild(renderCard(a)));
    col.appendChild(list);
  }
  return col;
}

function renderCard(a){
  const c=el("div",{class:"card", draggable:"true", dataset:{id:a.id}});
  c.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",a.id); e.dataTransfer.effectAllowed="move"; c.classList.add("dragging"); });
  c.addEventListener("dragend",()=>c.classList.remove("dragging"));
  c.addEventListener("click",()=>openAsset(a.id));

  const r1=el("div",{class:"r1"});
  r1.appendChild(el("span",{class:"ttag",text:typeMeta(a.type).tag}));
  const s=a.sessionId?sessionById(a.sessionId):null;
  r1.appendChild(el("span",{class:"snum"+(s?"":" course"), text: s?("S"+s.number):"course"}));
  if(a.tier) r1.appendChild(el("span",{class:"badge tier"+a.tier, text:"T"+a.tier}));
  c.appendChild(r1);

  c.appendChild(el("div",{class:"title",text:a.title}));

  const r2=el("div",{class:"r2"});
  if(a.owner) r2.appendChild(el("span",{class:"init", title:a.owner, text:initials(a.owner)}));
  if(a.due) r2.appendChild(el("span",{class:"badge"+(isOverdue(a.due)?" over":""), text:a.due.slice(5)}));
  if(a.checklist && a.checklist.length){
    const done=a.checklist.filter(i=>i.done).length;
    r2.appendChild(el("span",{class:"prog", text:done+"/"+a.checklist.length}));
  }
  if(r2.childNodes.length) c.appendChild(r2);

  if(a.status==="blocked" && a.blockedBy && a.blockedBy.length){
    const blk=el("div",{class:"blk"});
    a.blockedBy.forEach(b=>blk.appendChild(el("span",{class:"blkchip",text:b})));
    c.appendChild(blk);
  }
  return c;
}

function moveAsset(id, status){
  const a=state.assets.find(x=>x.id===id); if(!a || a.status===status) return;
  a.status=status; touch(a); saveData(); render();
}

function renderMatrix(){

  const bar=el("div",{class:"printbar no-print"});
  bar.appendChild(el("div",{class:"muted",style:"font-size:var(--fs-sm)"},"Rows are sessions, columns are asset types. Click a chip to edit; click a row to open the session. Empty cells add an asset of that type."));
  bar.appendChild(el("button",{class:"iconbtn", onclick:()=>window.print()},"⎙ Print A3"));
  wrap.appendChild(bar);

  const mw=el("div",{class:"matwrap"});
  const table=el("table",{class:"matrix"});
  // head
  const thead=el("thead"); const hr=el("tr");
  hr.appendChild(el("th",{class:"seshead",text:"Session"}));
  TYPES.forEach(t=>hr.appendChild(el("th",{text:t.label})));
  hr.appendChild(el("th",{text:"Built / total"}));
  thead.appendChild(hr); table.appendChild(thead);

  const tbody=el("tbody");
  const rows = state.sessions.slice().sort((a,b)=>a.number-b.number);
  rows.forEach(s=>tbody.appendChild(matrixRow(s)));
  // course-level row
  const courseAssets=state.assets.filter(a=>!a.sessionId);
  if(courseAssets.length) tbody.appendChild(matrixRow(null));
  table.appendChild(tbody);

  // footer per-type totals
  const tfoot=el("tfoot"); const fr=el("tr");
  fr.appendChild(el("td",{class:"sescell",text:"Per-type built / total"}));
  TYPES.forEach(t=>{
    const list=state.assets.filter(a=>a.type===t.id);
    const built=list.filter(a=>a.status==="built"||a.status==="tested").length;
    fr.appendChild(el("td",{text: list.length?(built+" / "+list.length):"—"}));
  });
  const allBuilt=state.assets.filter(a=>a.status==="built"||a.status==="tested").length;
  fr.appendChild(el("td",{text: allBuilt+" / "+state.assets.length}));
  tfoot.appendChild(fr); table.appendChild(tfoot);

  mw.appendChild(table); wrap.appendChild(mw);
  return wrap;
}

function matrixRow(s){
  const tr=el("tr");
  const isCourse = s===null;
  const sc=el("td",{class:"sescell"});
  if(isCourse){
    sc.appendChild(el("div",{class:"snhead"},[ el("span",{class:"n",text:"—"}), el("span",{class:"t",text:"Course-level (no session)"}) ]));
  } else {
    const sh=el("div",{class:"snhead", onclick:()=>{ ui.currentSession=s.id; setView("sessions"); }});
    sh.appendChild(el("span",{class:"n",text:s.number}));
    sh.appendChild(el("span",{class:"t",text:s.title}));
    sc.appendChild(sh);
    const meta=el("div",{class:"meta"});
    meta.appendChild(el("span",{class:"blocktag",text:s.block}));
    const mins=segMinutes(s);
    if(mins!==90) meta.appendChild(el("span",{class:"mwarn", title:"Segments sum to "+mins+" min, not 90", text:mins+"m"}));
    sc.appendChild(meta);
  }
  tr.appendChild(sc);

  const list = isCourse ? state.assets.filter(a=>!a.sessionId) : assetsForSession(s.id);
  TYPES.forEach(t=>{
    const cell=el("td",{class:"matcell"});
    const items=list.filter(a=>a.type===t.id);
    if(items.length){
      const box=el("div",{class:"cellchips"});
      items.forEach(a=>{
        const chip=el("span",{class:"chip", dataset:{st:a.status}, title:a.title+" · "+statusMeta(a.status).label, onclick:()=>openAsset(a.id)},
          [ el("span",{class:"minichip", style:"background:var(--st-"+a.status+"-fg);opacity:.85"}), a.tier?("T"+a.tier):typeMeta(a.type).tag ]);
        box.appendChild(chip);
      });
      cell.appendChild(box);
    } else if(!isCourse){
      cell.appendChild(el("button",{class:"emptycell", title:"Add "+t.label+" for session "+s.number, onclick:()=>quickAddAsset(s.id, t.id)}, "+"));
    }
    tr.appendChild(cell);
  });

  const built=list.filter(a=>a.status==="built"||a.status==="tested").length;
  tr.appendChild(el("td",{class:"donecell", text: list.length?(built+" / "+list.length):"—"}));
  return tr;
}

function quickAddAsset(sessionId, type){
  const s=sessionById(sessionId);
  const a={id:nextAssetId(), sessionId, type, title: typeMeta(type).label+" — "+(s?s.title:""), status:"todo", tier:null, owner:"", due:null, effort:null, blockedBy:[], checklist:[], notes:"", updatedAt:new Date().toISOString()};
  state.assets.push(a); saveData(); render(); openAsset(a.id);
}

function renderReading(s, r, idx){
  const li=el("li",{class:"reading"});
  const cite=el("div",{class:"cite"});
  cite.appendChild(el("input",{type:"text", value:r.citation, placeholder:"citation", onchange:(e)=>{ r.citation=e.target.value; saveData(); }}));
  li.appendChild(cite);
  if(r.status==="unverified") li.appendChild(el("span",{class:"unverified", text:"⚠ unverified"}));
  const sel=el("select",{onchange:(e)=>{ r.status=e.target.value; saveData(); render(); }});
  READING_STATUS.forEach(st=>sel.appendChild(el("option",{value:st, selected:r.status===st?"selected":null},st)));
  li.appendChild(sel);
  li.appendChild(el("button",{class:"minibtn", title:"Move up", disabled: idx===0?"disabled":null, onclick:()=>{ if(idx>0){ const a=s.readings; [a[idx-1],a[idx]]=[a[idx],a[idx-1]]; saveData(); render(); } }},"↑"));
  li.appendChild(el("button",{class:"minibtn", title:"Move down", disabled: idx===s.readings.length-1?"disabled":null, onclick:()=>{ const a=s.readings; if(idx<a.length-1){ [a[idx+1],a[idx]]=[a[idx],a[idx+1]]; saveData(); render(); } }},"↓"));
  li.appendChild(el("button",{class:"minibtn", title:"Delete reading", onclick:()=>{ s.readings.splice(idx,1); saveData(); render(); }},"×"));
  return li;
}

/* click-to-edit markdown field: renders markdown, edits raw */
function editable(getVal, setVal, opts){
  opts=opts||{};
  const val=getVal()||"";
  const disp=el("div",{class:"editable"+(val?"":" empty"), html: val?mdRender(val):esc(opts.placeholder||"—")});
  disp.addEventListener("click",()=>{
    const ta=el("textarea",{class:"edit"});
    ta.value=getVal()||"";
    disp.replaceWith(ta);
    autoGrow(ta); ta.focus();
    ta.addEventListener("input",()=>autoGrow(ta));
    const commit=()=>{
      const old=getVal()||""; const nv=ta.value;
      if(old!==nv){
        if(old!=="" && nv===""){ captureUndo("Field cleared"); }
        setVal(nv); saveData();
        if(old!=="" && nv===""){ commitUndo(); }
      }
      const nd=el("div",{class:"editable"+(nv?"":" empty"), html: nv?mdRender(nv):esc(opts.placeholder||"—")});
      nd.addEventListener("click",()=>{});
      ta.replaceWith(nd);
      // rebind by re-rendering only this: simplest is to re-run editable
      nd.replaceWith(editable(getVal,setVal,opts));
    };
    ta.addEventListener("blur",commit);
  });
  return disp;
}
function autoGrow(ta){ ta.style.height="auto"; ta.style.height=(ta.scrollHeight+2)+"px"; }

function blockedByDecision(id){ return state.assets.filter(a=>a.status==="blocked" && (a.blockedBy||[]).includes(id)); }
function decRow(d){
  const tr=el("tr");
  tr.appendChild(el("td",{class:"did",text:d.id}));
  tr.appendChild(el("td",{},[ el("div",{class:"dtitle",text:d.title}), el("div",{class:"dbody",text:d.body}) ]));
  const ownSel=el("select",{onchange:(e)=>{ d.owner=e.target.value; saveData(); }});
  ["client","hult","both"].forEach(o=>ownSel.appendChild(el("option",{value:o, selected:d.owner===o?"selected":null},o)));
  tr.appendChild(el("td",{},ownSel));
  const stSel=el("select",{onchange:(e)=>{ changeDecisionStatus(d, e.target.value); }});
  ["open","answered","deferred","moot"].forEach(o=>stSel.appendChild(el("option",{value:o, selected:d.status===o?"selected":null},o)));
  tr.appendChild(el("td",{},stSel));
  const blk=blockedByDecision(d.id);
  tr.appendChild(el("td",{class:"blkcount",text: blk.length?(blk.length+" blocked"):"—"}));
  const ans=el("td");
  const ta=el("textarea",{class:"answer", placeholder: d.status==="answered"?"answer":"—", value:d.answer, onchange:(e)=>{ d.answer=e.target.value; saveData(); }});
  ta.value=d.answer||"";
  ans.appendChild(ta);
  if(d.answeredOn) ans.appendChild(el("div",{class:"mono faint",style:"font-size:10px;margin-top:3px",text:"answered "+d.answeredOn}));
  tr.appendChild(ans);
  return tr;
}
function changeDecisionStatus(d, status){
  const was=d.status; d.status=status;
  if(status==="answered"){
    d.answeredOn=todayISO();
    const blk=blockedByDecision(d.id);
    if(blk.length){
      const list=blk.map(a=>{ const s=a.sessionId?("S"+sessionById(a.sessionId).number+" · "):""; return "• "+s+a.title; }).join("\n");
      // non-modal: use toast-style confirm via window.confirm is a modal — spec forbids modal *confirms* in app chrome, but this is an explicit prompt the spec asks for.
      const ok=confirm("Mark "+d.id+" answered.\n\nThese "+blk.length+" asset(s) are blocked by "+d.id+":\n\n"+list+"\n\nMove them out of Blocked now?\n(Assets still blocked by another decision stay blocked.)");
      if(ok){
        captureUndo("Unblocked "+blk.length+" asset(s)");
        blk.forEach(a=>{
          a.blockedBy=(a.blockedBy||[]).filter(x=>x!==d.id);
          if(a.blockedBy.length===0){ a.status="todo"; }
          touch(a);
        });
        saveData(); render(); commitUndo(); return;
      }
    }
  } else if(was==="answered" && status!=="answered"){
    d.answeredOn=null;
  }
  saveData(); render();
}

  const clWrap=el("div",{});
  (a.checklist||[]).forEach((item,idx)=>{
    const row=el("div",{class:"check"});
    row.appendChild(el("input",{type:"checkbox", checked:item.done?"checked":null, onchange:(e)=>{ item.done=e.target.checked; touch(a); saveData(); openAsset(a.id); render(); }}));
    const lab=el("div",{class:"clabel"+(item.done?" done":"")});
    lab.appendChild(el("input",{type:"text", value:item.label, oninput:(e)=>{ item.label=e.target.value; touch(a); saveData(); }}));
    row.appendChild(lab);
    row.appendChild(el("button",{class:"minibtn", title:"Up", disabled: idx===0?"disabled":null, onclick:()=>{ const c=a.checklist; [c[idx-1],c[idx]]=[c[idx],c[idx-1]]; saveData(); openAsset(a.id); }},"↑"));
    row.appendChild(el("button",{class:"minibtn", title:"Down", disabled: idx===a.checklist.length-1?"disabled":null, onclick:()=>{ const c=a.checklist; [c[idx+1],c[idx]]=[c[idx],c[idx+1]]; saveData(); openAsset(a.id); }},"↓"));
    row.appendChild(el("button",{class:"minibtn", title:"Delete", onclick:()=>{ a.checklist.splice(idx,1); touch(a); saveData(); openAsset(a.id); render(); }},"×"));
    clWrap.appendChild(row);
  });
  clWrap.appendChild(el("button",{class:"linkbtn", onclick:()=>{ a.checklist=a.checklist||[]; a.checklist.push({id:nextId("c"), label:"", done:false}); touch(a); saveData(); openAsset(a.id); }},"+ add checklist item"));
  body.appendChild(soField("Checklist", clWrap));

  body.appendChild(soField("Notes", el("textarea",{rows:4, value:a.notes||"", oninput:(e)=>{ a.notes=e.target.value; touch(a); saveData(); }})));

  so.appendChild(body);

  const foot=el("div",{class:"sofoot"});
  foot.appendChild(el("span",{class:"updated",text:"updated "+fmtTime(a.updatedAt)}));
  const del=el("button",{class:"delbtn", onclick:()=>armDelete(a, del)},"Delete");
  foot.appendChild(del);
  so.appendChild(foot);

  // A textarea's `value` attribute does not populate its content — copy it across.
  so.querySelectorAll("textarea").forEach(t=>{ if(t.getAttribute("value")!=null) t.value=t.getAttribute("value"); });

  document.getElementById("scrim").classList.add("show");
  so.classList.add("show");
}
function soField(label, control){
  const f=el("div",{class:"sofield"});
  f.appendChild(el("label",{text:label}));
  f.appendChild(control);
  return f;
}
function toggleBlockedBy(a, id){
  a.blockedBy=a.blockedBy||[];
  const i=a.blockedBy.indexOf(id);
  if(i<0){ a.blockedBy.push(id); if(a.status!=="blocked") a.status="blocked"; }
  else { a.blockedBy.splice(i,1); if(a.blockedBy.length===0 && a.status==="blocked") a.status="todo"; }
  touch(a); saveData(); openAsset(a.id); render();
}
function syncCardTitle(a){
  const card=document.querySelector('.card[data-id="'+a.id+'"] .title');
  if(card) card.textContent=a.title;
}
function armDelete(a, btn){
  if(delArmed){ if(delTimer) clearTimeout(delTimer); doDeleteAsset(a); return; }
  delArmed=true; btn.classList.add("arm"); btn.textContent="Confirm delete";
  delTimer=setTimeout(()=>{ delArmed=false; btn.classList.remove("arm"); btn.textContent="Delete"; },3000);
}
function doDeleteAsset(a){
  captureUndo("Deleted asset “"+a.title+"”");
  state.assets=state.assets.filter(x=>x.id!==a.id);
  saveData(); closeAsset(); render(); commitUndo();
}
function closeAsset(){
  openAssetId=null;
  document.getElementById("scrim").classList.remove("show");
  document.getElementById("slideover").classList.remove("show");
}
function fmtTime(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

/* =================================================================
   Export / import
   ================================================================= */
function download(filename, text, mime){
  const blob=new Blob([text], {type:mime||"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
}
function exportJSON(){
  state.meta.lastExport=new Date().toISOString();
  saveData(true);
  download("course-tracker-"+todayISO()+".json", JSON.stringify(state,null,2), "application/json");
  showToast("Exported JSON backup", null);
}
function handleImport(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }catch(e){ showToast("Import failed: not valid JSON", null); return; }
    if(!parsed || !parsed.sessions || !parsed.assets){ showToast("Import failed: not a tracker file", null); return; }
    captureUndo("Reverted import");
    if(parsed.schemaVersion!==SCHEMA_VERSION){ backupRaw(reader.result); parsed=migrate(parsed); }
    state=normalize(parsed); saveData(true); render(); closeAsset(); commitUndo();
  };
  reader.readAsText(file);
}
function resetToSeed(){
  captureUndo("Restored previous data");
  state=normalize(clone(SEED)); saveData(true); ui.menuOpen=false; render(); commitUndo();
}

function exportMarkdown(){
  let md="# "+state.meta.courseTitle+"\n\n";
  if(state.meta.cohort) md+="_"+state.meta.cohort+"_\n\n";
  state.sessions.slice().sort((a,b)=>a.number-b.number).forEach(s=>{ md+=sessionMarkdown(s)+"\n---\n\n"; });
  md+="\n# Decisions register\n\n";
  md+="| ID | Decision | Owner | Status | Answer |\n|---|---|---|---|---|\n";
  state.decisions.forEach(d=>{ md+="| "+d.id+" | "+mdCell(d.title)+" | "+d.owner+" | "+d.status+" | "+mdCell(d.answer||"")+" |\n"; });
  md+="\n# Asset status\n\n";
  md+="| Session | Type | Asset | Status | Tier | Owner | Due |\n|---|---|---|---|---|---|---|\n";
  state.assets.slice().sort((a,b)=>{
    const an=a.sessionId?sessionById(a.sessionId).number:99, bn=b.sessionId?sessionById(b.sessionId).number:99;
    return an-bn || a.type.localeCompare(b.type);
  }).forEach(a=>{
    const sn=a.sessionId?("S"+sessionById(a.sessionId).number):"course";
    md+="| "+sn+" | "+a.type+" | "+mdCell(a.title)+" | "+a.status+" | "+(a.tier||"")+" | "+(a.owner||"")+" | "+(a.due||"")+" |\n";
  });
  download("course-"+todayISO()+".md", md, "text/markdown");
  showToast("Exported course markdown", null);
}
function mdCell(s){ return String(s||"").replace(/\n/g," ").replace(/\|/g,"\\|"); }

function sessionMarkdown(s){
  let md="## Session "+s.number+" — "+s.title+"\n\n";
  const bits=[]; if(s.block) bits.push("**Block:** "+s.block); if(s.lens) bits.push("**Lens:** "+s.lens);
  bits.push("**Minutes:** "+segMinutes(s)+(segMinutes(s)!==90?" (≠90)":""));
  md+=bits.join("  ·  ")+"\n\n";
  if(s.question) md+="**Question.** "+s.question+"\n\n";
  [["provocation","Provocation"],["input","Input"],["activity","Activity"],["artefact","Artefact"]].forEach(([k,l])=>{
    if(s[k].body || s[k].minutes) md+="### "+l+" ("+s[k].minutes+" min)\n\n"+(s[k].body||"")+"\n\n";
  });
  if(s.fallback) md+="### Offline fallback\n\n"+s.fallback+"\n\n";
  if(s.readings.length){ md+="### Readings\n\n"; s.readings.forEach(r=>{ md+="- "+r.citation+" _("+r.status+")_\n"; }); md+="\n"; }
  if(s.confidenceFlags.length){ md+="### Confidence flags\n\n"; s.confidenceFlags.forEach(f=>{ md+="- ⚑ "+f+"\n"; }); md+="\n"; }
  if(s.decisionRefs.length) md+="**Decisions:** "+s.decisionRefs.join(", ")+"\n\n";
  if(s.notes) md+="### Notes\n\n"+s.notes+"\n\n";
  return md.trim()+"\n";
}
function copySessionMarkdown(s){
  const md=sessionMarkdown(s);
  const done=()=>showToast("Session copied as markdown", null);
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(md).then(done, ()=>fallbackCopy(md,done)); }
  else fallbackCopy(md, done);
}
function fallbackCopy(text, done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}
function exportDecisionsMarkdown(){
  let md="# Client meeting agenda — open decisions\n\n_"+state.meta.courseTitle+"_\n\n";
  ["client","both","hult"].forEach(owner=>{
    const rows=state.decisions.filter(d=>d.owner===owner);
    if(!rows.length) return;
    md+="## Owner: "+owner+"\n\n";
    rows.forEach(d=>{
      const blk=blockedByDecision(d.id).length;
      md+="### "+d.id+" — "+d.title+"  ("+d.status+")\n\n"+d.body+"\n\n";
      if(blk) md+="_Blocks "+blk+" asset(s)._\n\n";
      if(d.answer) md+="**Answer:** "+d.answer+"\n\n";
    });
  });
  download("client-decisions-"+todayISO()+".md", md, "text/markdown");
  showToast("Exported decisions markdown", null);
}

/* =================================================================
   Keyboard + global
   ================================================================= */
document.addEventListener("keydown",e=>{
  const t=e.target, tag=(t.tagName||"").toLowerCase();
  const typing = tag==="input"||tag==="textarea"||tag==="select"||t.isContentEditable;
  if((e.metaKey||e.ctrlKey) && (e.key==="s"||e.key==="S")){ e.preventDefault(); exportJSON(); return; }
  if(e.key==="Escape"){ if(openAssetId) closeAsset(); if(ui.menuOpen){ ui.menuOpen=false; render(); } return; }
  if(typing) return;
  if(e.key==="/"){ e.preventDefault(); const sb=document.getElementById("search"); if(sb){ sb.focus(); sb.select(); } return; }
  if(e.key==="1"){ setView("board"); }
  else if(e.key==="2"){ setView("matrix"); }
  else if(e.key==="3"){ setView("sessions"); }
  else if(e.key==="4"){ setView("decisions"); }
});
document.addEventListener("click",()=>{ if(ui.menuOpen){ ui.menuOpen=false; render(); } });
document.getElementById("scrim").addEventListener("click", closeAsset);
document.getElementById("importfile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) handleImport(f); e.target.value=""; });
if(window.matchMedia){ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(ui.theme==="auto") applyTheme(); }); }

/* =================================================================
   Boot
   ================================================================= */
ui=loadUI();
loadData();
render();

   multi-user/sync, auth, calendar/timetable generator, slide
   generation, file upload, rich-text editor, recurring tasks,
   notifications, mobile-first kanban, any server component.
   Open item (§9): per-session date overrides not built — derive
   from meta.startDate + sessionsPerWeek if the timetable proves
   irregular. Standing artefacts modelled as course-level admin
   assets with 15-item checklists per §9 recommendation.
   ----------------------------------------------------------------- */
